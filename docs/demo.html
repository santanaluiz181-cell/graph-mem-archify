<title>graph-mem-archify — Graph-Mem-Archify Interactive Map</title>
<style>
  :root {

    --surface: #FFFFFF;
    --surface-alt: #F1F5F9;
    --ink: #0F172A;
    --muted: #475569;
    --border: #E2E8F0;
    --green: #1D7447;
    --coral: #D96B43;
    --blue: #0066FF;
    --teal: #0EA5A4;
  }
  [data-theme="dark"] {
    --bg: #0B0F17;
    --dot: #1E293B;
    --surface: #111827;
    --surface-alt: #1E293B;
    --ink: #F8FAFC;
    --muted: #94A3B8;
    --border: #1F2937;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.5px, transparent 1.5px);
    background-size: 24px 24px;
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 16px; }
  .pill {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--muted);
  }
  .pill.green { color: #10B981; border-color: rgba(16,185,129,0.4); }
  .controls { display: flex; align-items: center; gap: 8px; }
  input[type="search"] {
    padding: 7px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    width: 220px;
  }
  button {
    padding: 7px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
  }
  button.active { background: var(--blue); color: #FFF; border-color: var(--blue); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  #canvasWrap { position: relative; overflow: auto; padding: 24px; }
  svg#graphSvg { display: block; min-width: 980px; min-height: 640px; }
  aside {
    background: var(--surface);
    border-left: 1.5px solid var(--border);
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .sym {
    display: flex;
    justify-content: space-between;
    padding: 5px 8px;
    border-radius: 6px;
    margin-top: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 12px;
  }
  .node-box { cursor: pointer; transition: opacity 0.15s; }
  .node-box:hover rect { stroke-width: 3px; }
</style>

d":"fn","name":"escapeHtml","line":8},{"kind":"fn","name":"classifyLayer","line":16},{"kind":"fn","name":"generateArchifyHtml","line":33},{"kind":"fn","name":"renderGraph","line":268},{"kind":"fn","name":"onNodeClick","line":335}]},{"id":3,"file":"docs/demo.html","shortName":"demo.html","layer":"Frontend","color":"#0066FF","lines":325,"sha8":"4d8a7a1a","inDegree":0,"outDegree":0,"symbols":[{"kind":"dom-id","name":"#savingsPill","line":140},{"kind":"dom-id","name":"#lensInput","line":143},{"kind":"dom-id","name":"#pathBtn","line":144},{"kind":"dom-id","name":"#themeBtn","line":145},{"kind":"dom-id","name":"#canvasWrap","line":149},{"kind":"dom-id","name":"#graphSvg","line":150},{"kind":"dom-id","name":"#inspectorTitle","line":155},{"kind":"dom-id","name":"#inspectorMeta","line":156},{"kind":"dom-id","name":"#pathCard","line":158},{"kind":"dom-id","name":"#pathResult","line":160},{"kind":"dom-id","name":"#symbolList","line":164}]},{"id":4,"file":"src/memory-bridge.mjs","shortName":"memory-bridge.mjs","layer":"Memory/DB","color":"#D96B43","lines":95,"sha8":"da70022e","inDegree":2,"outDegree":2,"symbols":[{"kind":"fn","name":"distillGraphForMemory","line":8},{"kind":"fn","name":"persistToClaudeMem","line":66}]},{"id":5,"file":"SKILL.md","shortName":"SKILL.md","layer":"Docs/Skill","color":"#0EA5A4","lines":38,"sha8":"8f376846","inDegree":0,"outDegree":0,"symbols":[{"kind":"heading","name":"Graph-Mem-Archify (`/graph-mem-archify`)","line":6},{"kind":"heading","name":"Why Combine All Three?","line":13},{"kind":"heading","name":"Pipeline Order (Strict)","line":19},{"kind":"heading","name":"Quick Execution","line":25},{"kind":"heading","name":"Or directly from source:","line":29},{"kind":"heading","name":"Agent Navigation Rule (PonyTail Slicing)","line":33}]},{"id":6,"file":"README.md","shortName":"README.md","layer":"Docs/Skill","color":"#0EA5A4","lines":89,"sha8":"02efd10e","inDegree":0,"outDegree":0,"symbols":[{"kind":"heading","name":"Credits & Upstream Attribution","line":34},{"kind":"heading","name":"Architecture Pipeline","line":46},{"kind":"heading","name":"Quick Start","line":61},{"kind":"heading","name":"Index + compress to memory + generate interactive HTML diagr","line":68},{"kind":"heading","name":"Brand & SVG Assets","line":82}]},{"id":7,"file":"src/cli.mjs","shortName":"cli.mjs","layer":"Core/AST","color":"#1D7447","lines":76,"sha8":"6bf521b9","inDegree":1,"outDegree":5,"symbols":[{"kind":"fn","name":"parseCliArgs","line":8},{"kind":"fn","name":"runPipeline","line":37}]},{"id":8,"file":".graphify_memory.md","shortName":".graphify_memory.md","layer":"Memory/DB","color":"#D96B43","lines":35,"sha8":"bda1b4d6","inDegree":0,"outDegree":0,"symbols":[{"kind":"heading","name":"CODEBASE AST TOPOLOGY: graph-mem-archify","line":1},{"kind":"heading","name":"1. HIGH-CENTRALITY HUBS (PONYTAIL TARGETS)","line":5},{"kind":"heading","name":"2. KEY SYMBOLS & LINE POINTERS","line":17},{"kind":"heading","name":"3. NAVIGATION DIRECTIVE","line":34}]},{"id":9,"file":"tests/pipeline.test.mjs","shortName":"pipeline.test.mjs","layer":"Tests","color":"#8B5CF6","lines":64,"sha8":"ee96a593","inDegree":0,"outDegree":11,"symbols":[]}],"edges":[{"from":9,"to":1,"fromFile":"tests/pipeline.test.mjs","toFile":"src/indexer.mjs"},{"from":9,"to":4,"fromFile":"tests/pipeline.test.mjs","toFile":"src/memory-bridge.mjs"},{"from":9,"to":2,"fromFile":"tests/pipeline.test.mjs","toFile":"src/archify-diagram.mjs"},{"from":9,"to":7,"fromFile":"tests/pipeline.test.mjs","toFile":"src/cli.mjs"},{"from":7,"to":1,"fromFile":"src/cli.mjs","toFile":"src/indexer.mjs"},{"from":7,"to":4,"fromFile":"src/cli.mjs","toFile":"src/memory-bridge.mjs"},{"from":7,"to":2,"fromFile":"src/cli.mjs","toFile":"src/archify-diagram.mjs"}]};
document.getElementById('savingsPill').textContent =
  GRAPH.metrics.savingsPct + '% token reduction (' + GRAPH.metrics.digestTokensEst + ' vs ' + GRAPH.metrics.rawTokensEst + ')';

const svg = document.getElementById('graphSvg');
const layers = ['Frontend', 'Core/AST', 'Memory/DB', 'Docs/Skill', 'Tests'];
const byLayer = new Map(layers.map(l => [l, []]));
GRAPH.nodes.forEach(n => (byLayer.get(n.layer) || byLayer.get('Core/AST')).push(n));

const positions = new Map();
let colX = 40;
layers.forEach(layer => {
  const list = byLayer.get(layer) || [];
  if (!list.length) return;
  list.forEach((n, rowIdx) => {
    positions.set(n.id, { x: colX, y: 40 + rowIdx * 110, w: 175, h: 80 });
  });
  colX += 210;
});

const maxX = Math.max(1120, ...Array.from(positions.values()).map(p => p.x + p.w + 40));
const maxY = Math.max(720, ...Array.from(positions.values()).map(p => p.y + p.h + 40));
svg.setAttribute('width', maxX);
svg.setAttribute('height', maxY);

let pathMode = false;
let pathSelection = [];
let highlightedEdges = new Set();

function renderGraph(filter = '') {
  const q = filter.trim().toLowerCase();
  svg.innerHTML = '';

  const edgeLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  GRAPH.edges.forEach((e, idx) => {
    const a = positions.get(e.from);
    const b = positions.get(e.to);
    if (!a || !b) return;
    const x1 = a.x + a.w / 2, y1 = a.y + a.h / 2;
    const x2 = b.x + b.w / 2, y2 = b.y + b.h / 2;
    const cx = (x1 + x2) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`);
    path.setAttribute('fill', 'none');
    const hot = highlightedEdges.has(idx);
    path.setAttribute('stroke', hot ? '#0066FF' : '#94A3B8');
    path.setAttribute('stroke-width', hot ? '3.5' : '1.6');
    path.setAttribute('opacity', hot ? '1' : '0.45');
    edgeLayer.appendChild(path);
  });
  svg.appendChild(edgeLayer);

  GRAPH.nodes.forEach(n => {
    const pos = positions.get(n.id);
    if (!pos) return;
    const matches = !q || n.file.toLowerCase().includes(q) || n.symbols.some(s => s.name.toLowerCase().includes(q));
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'node-box');
    g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
    g.setAttribute('opacity', matches ? '1' : '0.2');

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('width', pos.w);
    rect.setAttribute('height', pos.h);
    rect.setAttribute('rx', '12');
    rect.setAttribute('fill', 'var(--surface)');
    rect.setAttribute('stroke', pathSelection.includes(n.id) ? '#0066FF' : n.color);
    rect.setAttribute('stroke-width', pathSelection.includes(n.id) ? '3.5' : '2');
    g.appendChild(rect);

    const tag = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    tag.setAttribute('x', '12'); tag.setAttribute('y', '22');
    tag.setAttribute('fill', n.color); tag.setAttribute('font-size', '10');
    tag.setAttribute('font-weight', '800'); tag.setAttribute('font-family', 'monospace');
    tag.textContent = n.layer.toUpperCase();
    g.appendChild(tag);

    const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    title.setAttribute('x', '12'); title.setAttribute('y', '45');
    title.setAttribute('fill', 'var(--ink)'); title.setAttribute('font-size', '13');
    title.setAttribute('font-weight', '700');
    title.textContent = n.shortName.slice(0, 19);
    g.appendChild(title);

    const meta = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    meta.setAttribute('x', '12'); meta.setAttribute('y', '65');
    meta.setAttribute('fill', 'var(--muted)'); meta.setAttribute('font-size', '11');
    meta.setAttribute('font-family', 'monospace');
    meta.textContent = `L:${n.lines} • sym:${n.symbols.length}`;
    g.appendChild(meta);

    g.addEventListener('click', () => onNodeClick(n));
    svg.appendChild(g);
  });
}

function onNodeClick(n) {
  document.getElementById('inspectorTitle').textContent = n.file;
  document.getElementById('inspectorMeta').textContent = `lines: ${n.lines} | in: ${n.inDegree} | out: ${n.outDegree} | sha8: ${n.sha8}`;
  const symEl = document.getElementById('symbolList');
  symEl.innerHTML = n.symbols.length
    ? n.symbols.map(s => `<div class="sym"><span><b>[${s.kind}]</b> ${s.name}</span><span class="mono">:${s.line}</span></div>`).join('')
    : '<div class="mono" style="color:var(--muted);">No exported symbols</div>';

  if (pathMode) {
    pathSelection.push(n.id);
    if (pathSelection.length > 2) pathSelection = [n.id];
    highlightedEdges.clear();
    if (pathSelection.length === 2) {
      const [src, dst] = pathSelection;
      const queue = [[src, [src], []]];
      const seen = new Set([src]);
      let found = null;
      while (queue.length && !found) {
        const [cur, nodesPath, edgePath] = queue.shift();
        if (cur === dst) { found = { nodesPath, edgePath }; break; }
        GRAPH.edges.forEach((e, idx) => {
          const next = e.from === cur ? e.to : (e.to === cur ? e.from : null);
          if (next !== null && !seen.has(next)) {
            seen.add(next);
            queue.push([next, [...nodesPath, next], [...edgePath, idx]]);
          }
        });
      }
      const pCard = document.getElementById('pathCard');
      const pRes = document.getElementById('pathResult');
      pCard.style.display = 'block';
      if (found) {
        found.edgePath.forEach(idx => highlightedEdges.add(idx));
        pRes.textContent = found.nodesPath.map(id => GRAPH.nodes[id].shortName).join(' → ');
      } else {
        pRes.textContent = 'No direct local import path between selected boxes.';
      }
    }
    renderGraph(document.getElementById('lensInput').value);
  }
}

document.getElementById('lensInput').addEventListener('input', (e) => renderGraph(e.target.value));
document.getElementById('pathBtn').addEventListener('click', (e) => {
  pathMode = !pathMode;
  pathSelection = [];
  highlightedEdges.clear();
  e.target.textContent = pathMode ? 'Path Trace: ON' : 'Path Trace: OFF';
  e.target.classList.toggle('active', pathMode);
  if (!pathMode) document.getElementById('pathCard').style.display = 'none';
  renderGraph(document.getElementById('lensInput').value);
});
document.getElementById('themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
});

renderGraph();
</script>
